<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proctoring — cheat classifier</title>
  <style>
    :root { font-family: system-ui, sans-serif; background: #0f1419; color: #e7ecf3; }
    body { max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.35rem; font-weight: 600; }
    .card { background: #1a2332; border-radius: 10px; padding: 1.25rem; margin-top: 1rem; }
    label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: #9fb0c8; }
    input[type="file"], input[type="password"] { width: 100%; margin-bottom: 0.75rem; }
    button {
      background: #3b82f6; color: #fff; border: 0; padding: 0.6rem 1rem;
      border-radius: 8px; cursor: pointer; font-weight: 600;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    pre { background: #0b0f14; padding: 1rem; border-radius: 8px; overflow-x: auto; font-size: 0.85rem; }
    .alert { color: #f87171; font-weight: 600; }
    .ok { color: #4ade80; }
    a { color: #93c5fd; }
  </style>
</head>
<body>
  <h1>Online exam — cheating classifier</h1>
  <p>Upload a snapshot (640×640 images match training). Alert if P(cheating) ≥ {{ cheat_threshold }}.</p>

  <div class="card">
    {% if api_key_required %}
    <label for="apiKey">API key (sent as <code>X-API-Key</code>)</label>
    <input type="password" id="apiKey" autocomplete="off" />
    {% endif %}
    <label for="file">Image</label>
    <input type="file" id="file" accept="image/*" />
    <button type="button" id="run">Analyze</button>
  </div>

  <div class="card">
    <div id="status"></div>
    <pre id="out">{}</pre>
  </div>

  <p style="margin-top:1.5rem;font-size:0.85rem;color:#7d8da3;">
    Full portal: <a href="/">/</a>. LMS: link or iframe this page, or POST to <a href="/api/meta"><code>/api/meta</code></a> / <code>/api/predict</code>.
  </p>

  <script>
    const cheatThreshold = {{ cheat_threshold }};
    const apiKeyRequired = {{ api_key_required|tojson }};

    document.getElementById('run').addEventListener('click', async () => {
      const fileInput = document.getElementById('file');
      const status = document.getElementById('status');
      const out = document.getElementById('out');
      const btn = document.getElementById('run');
      if (!fileInput.files.length) {
        status.textContent = 'Choose an image first.';
        return;
      }
      const fd = new FormData();
      fd.append('file', fileInput.files[0]);
      const headers = {};
      if (apiKeyRequired) {
        const k = document.getElementById('apiKey').value.trim();
        if (!k) { status.textContent = 'API key required.'; return; }
        headers['X-API-Key'] = k;
      }
      btn.disabled = true;
      status.textContent = 'Running…';
      out.textContent = '';
      try {
        const res = await fetch('/api/predict', { method: 'POST', body: fd, headers });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          status.innerHTML = '<span class="alert">Error: ' + (data.detail || res.statusText) + '</span>';
          out.textContent = JSON.stringify(data, null, 2);
          return;
        }
        const alert = data.alert ? '<span class="alert">ALERT: possible cheating</span>' : '<span class="ok">No alert</span>';
        status.innerHTML = alert + ' — P(cheating)=' + (data.cheat_probability ?? 0).toFixed(4) + ' (threshold ' + cheatThreshold + ')';
        out.textContent = JSON.stringify(data, null, 2);
      } catch (e) {
        status.innerHTML = '<span class="alert">Request failed</span>';
        out.textContent = String(e);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
